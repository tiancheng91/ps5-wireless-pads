name: Test and build PS5 payload

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LLVM_CONFIG: /usr/bin/llvm-config-18
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 lld-18
      - name: Host regression tests
        run: make test
      - name: Download pinned PS5 SDK
        run: |
          curl --fail --location --retry 3 \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.45/ps5-payload-sdk.zip \
            -o "$RUNNER_TEMP/ps5-sdk.zip"
          echo '5fac64093d0e3e69f2584ce7935f24f703f622d9681f1495c85b9f00d1291a2c  ps5-sdk.zip' \
            | (cd "$RUNNER_TEMP" && sha256sum --check)
          unzip -q "$RUNNER_TEMP/ps5-sdk.zip" -d "$RUNNER_TEMP/ps5-sdk"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-sdk/ps5-payload-sdk" >> "$GITHUB_ENV"
      - name: Build payload
        run: |
          make -f ps5.mk CFLAGS='-std=c11 -Wall -Wextra -Werror -O2 -Isrc'
          version=$(sed -n 's/^#define PADBRIDGE_VERSION "\(.*\)"/\1/p' src/version.h)
          mkdir -p build/artifact
          cp "dist/PadBridge-PS5-$version.elf" build/artifact/PadBridge-PS5.elf
          (cd build/artifact && sha256sum PadBridge-PS5.elf > PadBridge-PS5.elf.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: PadBridge-PS5
          path: build/artifact/
          if-no-files-found: error
          retention-days: 7
